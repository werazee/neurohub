  if(i>-1){S.voted.splice(i,1);S.votes[id]=(S.votes[id]||0)-1}else{S.voted.push(id);S.votes[id]=(S.votes[id]||0)+1}
  save();return render()}
 if(el=g('data-copy'))return copy(PROMPTS.find(p=>p.id===el.dataset.copy).text);
 if(el=g('data-use')){S.cp=PROMPTS.findIndex(p=>p.id===el.dataset.use);S.vals={};render();$('#tpl').scrollIntoView({behavior:'smooth',block:'center'});return}
 if(g('data-copyprev'))return copy(build());
 if(el=g('data-done')){const i=+el.dataset.done;if(!S.done.includes(i))S.done.push(i);save();return render()}
 if(g('data-reset')){S.done=[];save();return render()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='fav'){S.onlyFav=e.target.checked;render()}
 if(e.target.id==='tpl'){S.cp=+e.target.value;S.vals={};render()}
});
document.addEventListener('input',e=>{
 if(e.target.dataset&&e.target.dataset.k){S.vals[e.target.dataset.k]=e.target.value;$('#prev').textContent=build()}
});
let qt;
$('#q').addEventListener('input',e=>{
 S.q=e.target.value;clearTimeout(qt);
 qt=setTimeout(()=>{if(S.q.trim()&&(S.tab==='dash'||S.tab==='learn'))S.tab='cat';render()},120);
});
render();
</script>
</body>
</html>
